<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fight Club Sprite Animator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 800px;
            width: 90%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #718096;
            font-size: 1.1em;
        }

        .sprite-display {
            background: #f7fafc;
            border: 3px dashed #cbd5e0;
            border-radius: 10px;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .sprite-display.has-sprites {
            border: 3px solid #48bb78;
            background: #f0fff4;
        }

        .sprite-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .placeholder {
            text-align: center;
            color: #a0aec0;
        }

        .placeholder i {
            font-size: 4em;
            margin-bottom: 20px;
            display: block;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .control-group h3 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            text-align: center;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .speed-control {
            margin-bottom: 15px;
        }

        .speed-control label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .speed-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
            -webkit-appearance: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .speed-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .animation-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .info-panel {
            background: #ebf8ff;
            border: 1px solid #90cdf4;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        .info-panel h4 {
            color: #2b6cb0;
            margin-bottom: 10px;
        }

        .sprite-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            font-size: 0.9em;
        }

        .sprite-info span {
            color: #2c5282;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 20px;
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗡️ Fight Club Sprite Animator</h1>
            <p>Upload your sprite frames and watch them come to life!</p>
        </div>

        <div class="sprite-display" id="spriteDisplay">
            <div class="placeholder">
                <i>🖼️</i>
                <h3>Upload sprite frames to get started</h3>
                <p>Select multiple PNG files (elf_1.png, elf_2.png, etc.)</p>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>📁 Load Sprites</h3>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" class="file-input" multiple accept=".png,.jpg,.jpeg,.gif">
                    <label for="fileInput" class="file-input-label">Choose Sprite Files</label>
                </div>
            </div>

            <div class="control-group">
                <h3>⚡ Animation Controls</h3>
                <div class="speed-control">
                    <label for="speedSlider">Speed: <span id="speedValue">10</span> FPS</label>
                    <input type="range" id="speedSlider" class="speed-slider" min="1" max="30" value="10">
                </div>
                <div class="animation-controls">
                    <button id="startBtn" class="btn btn-primary" disabled>▶️ Start</button>
                    <button id="stopBtn" class="btn btn-secondary" disabled>⏹️ Stop</button>
                </div>
            </div>
        </div>

        <div class="info-panel" id="infoPanel" style="display: none;">
            <h4>📊 Animation Info</h4>
            <div class="sprite-info" id="spriteInfo">
                <!-- Info will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        class SpriteAnimator {
            constructor() {
                this.sprites = [];
                this.currentFrame = 0;
                this.animationId = null;
                this.isAnimating = false;
                this.fps = 10;

                this.initializeElements();
                this.bindEvents();
            }

            initializeElements() {
                this.fileInput = document.getElementById('fileInput');
                this.spriteDisplay = document.getElementById('spriteDisplay');
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.speedSlider = document.getElementById('speedSlider');
                this.speedValue = document.getElementById('speedValue');
                this.infoPanel = document.getElementById('infoPanel');
                this.spriteInfo = document.getElementById('spriteInfo');
            }

            bindEvents() {
                this.fileInput.addEventListener('change', (e) => this.handleFileUpload(e));
                this.startBtn.addEventListener('click', () => this.startAnimation());
                this.stopBtn.addEventListener('click', () => this.stopAnimation());
                this.speedSlider.addEventListener('input', (e) => this.updateSpeed(e));
            }

            handleFileUpload(event) {
                const files = Array.from(event.target.files);
                if (files.length === 0) return;

                // Sort files by name to ensure proper sequence
                files.sort((a, b) => {
                    const getNumber = (filename) => {
                        const match = filename.match(/(\d+)/);
                        return match ? parseInt(match[1]) : 0;
                    };
                    return getNumber(a.name) - getNumber(b.name);
                });

                this.loadSprites(files);
            }

            loadSprites(files) {
                this.sprites = [];
                let loadedCount = 0;

                files.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.sprites[index] = {
                            src: e.target.result,
                            name: file.name,
                            size: file.size
                        };
                        loadedCount++;

                        if (loadedCount === files.length) {
                            this.onSpritesLoaded();
                        }
                    };
                    reader.readAsDataURL(file);
                });
            }

            onSpritesLoaded() {
                if (this.sprites.length === 0) return;

                // Update UI
                this.spriteDisplay.classList.add('has-sprites');
                this.startBtn.disabled = false;
                this.stopBtn.disabled = false;

                // Show first frame
                this.currentFrame = 0;
                this.displayCurrentFrame();

                // Update info panel
                this.updateInfoPanel();
            }

            displayCurrentFrame() {
                if (this.sprites.length === 0) return;

                const sprite = this.sprites[this.currentFrame];
                if (!sprite) return;

                this.spriteDisplay.innerHTML = `
                    <img src="${sprite.src}" alt="${sprite.name}" class="sprite-image">
                `;
            }

            startAnimation() {
                if (this.sprites.length === 0 || this.isAnimating) return;

                this.isAnimating = true;
                this.startBtn.disabled = true;
                this.animate();
            }

            stopAnimation() {
                this.isAnimating = false;
                this.startBtn.disabled = false;
                if (this.animationId) {
                    clearTimeout(this.animationId);
                    this.animationId = null;
                }
            }

            animate() {
                if (!this.isAnimating) return;

                this.currentFrame = (this.currentFrame + 1) % this.sprites.length;
                this.displayCurrentFrame();

                const frameDelay = 1000 / this.fps;
                this.animationId = setTimeout(() => this.animate(), frameDelay);
            }

            updateSpeed(event) {
                this.fps = parseInt(event.target.value);
                this.speedValue.textContent = this.fps;
            }

            updateInfoPanel() {
                if (this.sprites.length === 0) {
                    this.infoPanel.style.display = 'none';
                    return;
                }

                const totalSize = this.sprites.reduce((sum, sprite) => sum + sprite.size, 0);
                const formatSize = (bytes) => {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                };

                this.spriteInfo.innerHTML = `
                    <div><span>Frames:</span> ${this.sprites.length}</div>
                    <div><span>Current:</span> ${this.currentFrame + 1}</div>
                    <div><span>Total Size:</span> ${formatSize(totalSize)}</div>
                    <div><span>Format:</span> ${this.sprites[0].name.split('.').pop().toUpperCase()}</div>
                `;

                this.infoPanel.style.display = 'block';
            }
        }

        // Initialize the sprite animator when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new SpriteAnimator();
        });
    </script>
</body>
</html>
