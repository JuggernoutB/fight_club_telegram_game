<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Fight vs Players</title>
    <link rel="stylesheet" href="css/game-styles.css">
</head>
<body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>

    <div class="game-container players-container">
        <div class="game-header">
            <h1>⚔️ FIGHT VS PLAYERS</h1>
            <div class="subtitle">Challenge other warriors</div>
        </div>

        <div class="tabs-container">
            <!-- Tab Navigation -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('players')">
                    👥 Online Players
                </button>
                <button class="tab" onclick="switchTab('requests')">
                    📨 Fight Requests<span id="requestsCount" class="request-count" style="display: none;"></span>
                </button>
            </div>

            <!-- Players Tab Content -->
            <div id="players-tab" class="tab-content active">
                <div class="tab-section">
                    <div id="content"></div>
                </div>
                <div class="button-group">
                    <button id="fightBtn" class="btn-action btn-fight-player" disabled>
                        ⚔️ Challenge
                    </button>
                    <button id="refreshBtn" class="btn-secondary btn-refresh">
                        🔄 Refresh
                    </button>
                    <button id="backBtn" class="btn-secondary btn-back">
                        🏠 Back
                    </button>
                </div>
            </div>

            <!-- Requests Tab Content -->
            <div id="requests-tab" class="tab-content">
                <div class="tab-section">
                    <div id="sentRequests">
                        <h3 style="color: var(--secondary-gold); margin-bottom: 16px;">📤 Sent Requests</h3>
                        <div id="sentRequestsList">
                            <div class="empty-state">
                                <div class="empty-icon">📤</div>
                                <p>No sent requests</p>
                            </div>
                        </div>
                    </div>
                    <div id="receivedRequests" style="margin-top: 30px;">
                        <h3 style="color: var(--secondary-gold); margin-bottom: 16px;">📥 Received Requests</h3>
                        <div id="receivedRequestsList">
                            <div class="empty-state">
                                <div class="empty-icon">📥</div>
                                <p>No received requests</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="button-group">
                    <button id="refreshRequestsBtn" class="btn-secondary btn-refresh">
                        🔄 Refresh
                    </button>
                    <button id="backFromRequestsBtn" class="btn-secondary btn-back">
                        🏠 Back
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedPlayer = null;
        let playersList = [];
        let currentPlayerId = null;
        let telegram_id = null; // For main.js compatibility
        let requestsPollingInterval = null;
        let challengePollingInterval = null;
        let sentRequests = [];
        let receivedRequests = [];

        // Tab switching functionality
        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab content
            document.getElementById(tabName + '-tab').classList.add('active');

            // Activate the clicked tab
            event.target.classList.add('active');

            // If switching to requests tab, load requests
            if (tabName === 'requests') {
                loadRequests();
                // Start polling for requests updates
                if (!requestsPollingInterval) {
                    requestsPollingInterval = setInterval(loadRequests, 3000);
                }
            } else {
                // Stop requests polling when leaving requests tab
                if (requestsPollingInterval) {
                    clearInterval(requestsPollingInterval);
                    requestsPollingInterval = null;
                }
            }
        }

        // Requests management functionality
        async function loadRequests() {
            if (!currentPlayerId) return;

            try {
                // Check for challenges as both challenger and target
                const response = await fetch(`/check-challenges/${currentPlayerId}`);
                const data = await response.json();

                if (data.hasChallenge) {
                    const challenge = data.challenge;

                    if (challenge.is_challenger) {
                        // This is a sent request
                        updateSentRequests([challenge]);
                        updateReceivedRequests([]);
                    } else {
                        // This is a received request
                        updateSentRequests([]);
                        updateReceivedRequests([challenge]);
                    }
                } else {
                    // No challenges
                    updateSentRequests([]);
                    updateReceivedRequests([]);
                }

                updateRequestsCount();
            } catch (error) {
                console.error('Error loading requests:', error);
            }
        }

        function calculateTimeLeft(timestamp) {
            const now = Date.now();
            const elapsed = now - timestamp;
            const CHALLENGE_TIMEOUT = 30 * 1000; // 30 seconds in milliseconds
            const remainingMs = CHALLENGE_TIMEOUT - elapsed;
            const remainingSeconds = Math.max(0, Math.floor(remainingMs / 1000));
            return remainingSeconds;
        }

        function updateSentRequests(requests) {
            sentRequests = requests;
            const sentList = document.getElementById('sentRequestsList');

            if (requests.length === 0) {
                sentList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📤</div>
                        <p>No sent requests</p>
                    </div>
                `;
                return;
            }

            sentList.innerHTML = requests.map(request => `
                <div class="request-item">
                    <div class="request-header">
                        <div class="request-type request-sent">Sent Request</div>
                    </div>
                    <div class="request-player">⚔️ Challenge to: ${request.target_nickname}</div>
                    <div class="request-timer" id="sent-timer-${request.target_id}">⏱️ Calculating...</div>
                    <div class="request-actions">
                        <button class="btn-small btn-cancel" onclick="cancelSentRequest('${request.target_id}', '${request.target_nickname}')">
                            ❌ Cancel
                        </button>
                    </div>
                </div>
            `).join('');

            // Start timers for sent requests
            requests.forEach(request => {
                const timeLeft = calculateTimeLeft(request.timestamp);
                startRequestTimer(`sent-timer-${request.target_id}`, timeLeft);
            });
        }

        function updateReceivedRequests(requests) {
            receivedRequests = requests;
            const receivedList = document.getElementById('receivedRequestsList');

            if (requests.length === 0) {
                receivedList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📥</div>
                        <p>No received requests</p>
                    </div>
                `;
                return;
            }

            receivedList.innerHTML = requests.map(request => `
                <div class="request-item">
                    <div class="request-header">
                        <div class="request-type request-received">Received Request</div>
                    </div>
                    <div class="request-player">⚔️ Challenge from: ${request.challenger_nickname}</div>
                    <div class="request-timer" id="received-timer-${request.challenger_id}">⏱️ Calculating...</div>
                    <div class="request-actions">
                        <button class="btn-small btn-accept" onclick="acceptRequest('${request.challenger_id}', '${request.challenger_nickname}')">
                            ✅ Accept
                        </button>
                        <button class="btn-small btn-decline" onclick="declineRequest('${request.challenger_id}', '${request.challenger_nickname}')">
                            ❌ Decline
                        </button>
                    </div>
                </div>
            `).join('');

            // Start timers for received requests
            requests.forEach(request => {
                const timeLeft = calculateTimeLeft(request.timestamp);
                startRequestTimer(`received-timer-${request.challenger_id}`, timeLeft);
            });
        }

        function startRequestTimer(elementId, initialSeconds) {
            let timeLeft = initialSeconds;
            const element = document.getElementById(elementId);

            const updateTimer = () => {
                if (element) {
                    element.textContent = `⏱️ ${timeLeft}s remaining`;
                    if (timeLeft <= 0) {
                        element.textContent = '⏰ Expired';
                        element.style.color = '#f44336';
                    }
                }
                timeLeft--;
            };

            updateTimer();
            const timer = setInterval(() => {
                updateTimer();
                if (timeLeft < 0) {
                    clearInterval(timer);
                    // Refresh requests after expiry
                    setTimeout(loadRequests, 1000);
                }
            }, 1000);
        }

        function updateRequestsCount() {
            const count = sentRequests.length + receivedRequests.length;
            const countElement = document.getElementById('requestsCount');
            if (count > 0) {
                countElement.textContent = count;
                countElement.style.display = 'inline-block';
            } else {
                countElement.style.display = 'none';
            }
        }

        // Request action handlers
        async function acceptRequest(challengerId, challengerNickname) {
            console.log('acceptRequest called:', { challengerId, challengerNickname, currentPlayerId });
            try {
                const response = await fetch('/join-fight', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challenger_id: challengerId,
                        target_id: currentPlayerId
                    })
                });

                const result = await response.json();
                console.log('join-fight response:', { ok: response.ok, result });

                if (response.ok) {
                    console.log('About to call startPvPFight with fight_id:', result.fight_id);
                    // Call startPvPFight directly (defined inline below)
                    console.log('Calling startPvPFight with:', result.fight_id, challengerNickname);
                    startPvPFight(result.fight_id, challengerNickname);
                } else {
                    alert(`Failed to accept fight: ${result.message}`);
                }
            } catch (error) {
                console.error('Error accepting request:', error);
                alert('Failed to accept fight request');
            }
        }

        async function declineRequest(challengerId, challengerNickname) {
            try {
                const response = await fetch('/cancel-challenge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challenger_id: challengerId,
                        target_id: currentPlayerId,
                        cancelled_by: currentPlayerId
                    })
                });

                if (response.ok) {
                    console.log(`Declined fight request from ${challengerNickname}`);
                    loadRequests();
                } else {
                    alert('Failed to decline request');
                }
            } catch (error) {
                console.error('Error declining request:', error);
                alert('Failed to decline request');
            }
        }

        async function cancelSentRequest(targetId, targetNickname) {
            try {
                const response = await fetch('/cancel-challenge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challenger_id: currentPlayerId,
                        target_id: targetId,
                        cancelled_by: currentPlayerId
                    })
                });

                if (response.ok) {
                    console.log(`Cancelled fight request to ${targetNickname}`);
                    loadRequests();
                } else {
                    alert('Failed to cancel request');
                }
            } catch (error) {
                console.error('Error cancelling request:', error);
                alert('Failed to cancel request');
            }
        }

        function render(players){
            playersList = players;
            const content = document.getElementById('content');
            if(!players || players.length === 0){
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">👥</div>
                        <p>No players online right now</p>
                        <small>Check back later or invite friends to play!</small>
                    </div>
                `;
                selectedPlayer = null;
                updateFightButton();
                return;
            }

            const list = document.createElement('ul');
            list.className = 'players-list';

            players.forEach(p => {
                const li = document.createElement('li');
                li.className = 'player-item';
                li.dataset.telegramId = p.telegram_id;
                li.dataset.nickname = p.nickname;
                li.dataset.level = p.level;

                // Generate level stars
                const levelStars = "⭐".repeat(Math.min(p.level, 5));

                li.innerHTML = `
                    <div class="player-avatar-small">
                        👤
                    </div>
                    <div class="player-info">
                        <div class="player-name">${p.nickname}</div>
                        <div class="player-level">Level ${p.level} ${levelStars}</div>
                    </div>
                    <div class="player-status status-online">Online</div>
                `;

                // Add click handler for selection
                li.onclick = () => selectPlayer(p, li);

                list.appendChild(li);
            });

            content.innerHTML = '';
            content.appendChild(list);
        }

        function selectPlayer(player, liElement) {
            // Remove previous selection
            document.querySelectorAll('.player-item').forEach(li => li.classList.remove('selected'));

            // Add selection to clicked item
            liElement.classList.add('selected');
            selectedPlayer = player;

            console.log('Selected player:', selectedPlayer);
            updateFightButton();
        }

        function updateFightButton() {
            const fightBtn = document.getElementById('fightBtn');
            fightBtn.disabled = !selectedPlayer;
        }


        async function load(){
            try {
                // Get current player ID from URL params first, then Telegram WebApp as fallback
                const urlParams = new URLSearchParams(window.location.search);
                currentPlayerId = urlParams.get('telegram_id');

                // Fallback to Telegram WebApp if not in URL
                if (!currentPlayerId && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    currentPlayerId = window.Telegram.WebApp.initDataUnsafe.user.id;
                }

                // Set telegram_id for main.js compatibility
                telegram_id = currentPlayerId;

                console.log('Current player ID for exclusion:', currentPlayerId);
                const url = currentPlayerId ? `/players-online?exclude=${currentPlayerId}` : '/players-online';
                console.log('Fetching URL:', url);

                const res = await fetch(url);
                const data = await res.json();
                console.log('Players data received:', data);
                render(data.players || []);

                // Load requests for the requests tab count
                loadRequests();

                // Start challenge polling to detect when sent challenges are accepted
                startChallengePolling();
            } catch (e){
                console.error('Failed to load players:', e);
            }
        }

        // Challenge polling for Player #1 to detect when their challenge is accepted
        function startChallengePolling() {
            if (challengePollingInterval) return; // Already running

            challengePollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/check-challenges/${currentPlayerId}`);
                    const data = await response.json();

                    if (data.hasChallenge) {
                        console.log('Challenge polling detected:', data.challenge);
                        if (data.challenge.is_challenger) {
                            if (data.challenge.status === 'accepted') {
                                // Challenge was accepted, stop polling and show simple fight window for Player #1 (challenger)
                                console.log('Challenge accepted! Redirecting Player #1 to fight screen...');
                                clearInterval(challengePollingInterval);
                                challengePollingInterval = null;
                                // Use the fight_id from the challenge response
                                startPvPFight(data.challenge.fight_id, data.challenge.target_nickname);
                            }
                            // Note: we don't show "waiting" status here since requests tab handles it
                        }
                    }
                } catch (error) {
                    console.error('Error checking challenges:', error);
                }
            }, 1000); // Poll every 1 second for more responsive detection
        }

        document.getElementById('fightBtn').onclick = async () => {
            if (selectedPlayer) {
                try {
                    // Get current player info
                    const urlParams = new URLSearchParams(window.location.search);
                    let currentPlayerId = urlParams.get('telegram_id');
                    
                    if (!currentPlayerId && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                        currentPlayerId = window.Telegram.WebApp.initDataUnsafe.user.id;
                    }

                    // Get current player's nickname
                    const profileResponse = await fetch(`/profile/${currentPlayerId}`);
                    const profileData = await profileResponse.json();
                    
                    if (!profileData.exists) {
                        alert('Error: Current player profile not found');
                        return;
                    }

                    // Send challenge
                    const challengeResponse = await fetch('/challenge', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            challenger_id: currentPlayerId,
                            target_id: selectedPlayer.telegram_id,
                            challenger_nickname: profileData.profile.nickname
                        })
                    });

                    const challengeResult = await challengeResponse.json();
                    
                    if (challengeResponse.ok) {
                        console.log(`Challenge sent to ${selectedPlayer.nickname}!`);
                        // Challenge status will be shown in Fight Requests tab
                    } else {
                        alert(`Failed to send challenge: ${challengeResult.message}`);
                    }
                } catch (error) {
                    console.error('Error sending challenge:', error);
                    alert('Failed to send challenge. Please try again.');
                }
            }
        };

        document.getElementById('refreshBtn').onclick = load;
        document.getElementById('backBtn').onclick = () => {
            window.location.href = '/';
        };

        // New button handlers for requests tab
        document.getElementById('refreshRequestsBtn').onclick = loadRequests;
        document.getElementById('backFromRequestsBtn').onclick = () => {
            window.location.href = '/';
        };

        // Clean up intervals when leaving the page
        window.addEventListener('beforeunload', () => {
            if (requestsPollingInterval) {
                clearInterval(requestsPollingInterval);
            }
            if (challengePollingInterval) {
                clearInterval(challengePollingInterval);
            }
        });

        function showSimpleFightWindow(opponentNickname) {
            // Stop any existing polling
            if (requestsPollingInterval) {
                clearInterval(requestsPollingInterval);
                requestsPollingInterval = null;
            }
            if (challengePollingInterval) {
                clearInterval(challengePollingInterval);
                challengePollingInterval = null;
            }

            // Start PvP fight using global telegram_id
            startPvPFight(null, opponentNickname);
        }


        // Simple inline PvP fight function to avoid script conflicts
        function startPvPFight(fight_id, opponentNickname) {
            console.log('Starting PvP fight with:', fight_id, opponentNickname);

            // Store fight_id for API calls
            window.currentFightId = fight_id;

            // Reset opponent image flag for new fight
            opponentImageLoaded = false;

            // Redirect to a simple PvP fight interface
            document.body.innerHTML = `
                <div class="game-container fight-container">
                    <div class="game-header">
                        <h1>⚔️ PVP ARENA</h1>
                        <div class="subtitle">Battle against ${opponentNickname}</div>
                    </div>
                    <div class="fight-vs-section">
                        <div class="fighter-card" id="playerCard">
                            <div class="fighter-image-container" id="playerImageContainer">
                                <div class="fighter-fallback" id="playerFallback">🧑</div>
                            </div>
                            <div class="fighter-name" id="playerName">You</div>
                            <div class="fighter-hp">
                                <div class="hp-label">❤️ Health Points</div>
                                <div id="playerHPText">20/20</div>
                                <div id="playerHPBar">${renderHPBar(20, 20)}</div>
                            </div>
                        </div>
                        <div class="vs-divider">⚔️<br>VS</div>
                        <div class="fighter-card" id="opponentCard">
                            <div class="fighter-image-container" id="opponentImageContainer">
                                <div class="fighter-fallback">👤</div>
                            </div>
                            <div class="fighter-name" id="opponentName">${opponentNickname}</div>
                            <div class="fighter-hp">
                                <div class="hp-label">❤️ Health Points</div>
                                <div id="opponentHPText">20/20</div>
                                <div id="opponentHPBar">${renderHPBar(20, 20)}</div>
                            </div>
                        </div>
                    </div>
                    <div class="fight-controls">
                        <div class="fight-actions">
                            <div class="action-group">
                                <div class="action-label">🎯 Attack Target</div>
                                <div class="body-parts" id="hitParts">
                                    <div class="body-part" data-part="head">🧠 Head</div>
                                    <div class="body-part" data-part="chest">👕 Chest</div>
                                    <div class="body-part" data-part="stomach">🥋 Stomach</div>
                                    <div class="body-part" data-part="legs">🦵 Legs</div>
                                </div>
                            </div>
                            <div class="action-group">
                                <div class="action-label">🛡️ Defend Area</div>
                                <div class="body-parts" id="defendParts">
                                    <div class="body-part" data-part="head">🧠 Head</div>
                                    <div class="body-part" data-part="chest">👕 Chest</div>
                                    <div class="body-part" data-part="stomach">🥋 Stomach</div>
                                    <div class="body-part" data-part="legs">🦵 Legs</div>
                                </div>
                            </div>
                        </div>
                        <button class="attack-button" id="submitBtn" disabled>⚔️ ATTACK!</button>
                    </div>

                    <div id="fightLog" class="fight-log" style="display: none;">
                        <div class="fight-log-header">📜 Fight Log</div>
                        <div class="fight-log-content" id="logContent"></div>
                    </div>

                    <div class="fight-status">
                        <p></p>
                        <button class="btn-secondary" onclick="window.location.href='/players.html?telegram_id=${currentPlayerId}'">
                            🏠 Back to Players
                        </button>
                    </div>
                </div>
            `;

            // Set up body part selection
            setupSimpleBodyParts();

            // Load fighter images
            loadPvPFighterImages();
        }

        function setupSimpleBodyParts() {
            let selectedHit = null;
            let selectedDefend = null;

            // Hit parts selection
            document.querySelectorAll('#hitParts .body-part').forEach(part => {
                part.addEventListener('click', () => {
                    document.querySelectorAll('#hitParts .body-part').forEach(p => p.classList.remove('selected'));
                    part.classList.add('selected');
                    selectedHit = part.dataset.part;
                    updateAttackButton();
                });
            });

            // Defend parts selection
            document.querySelectorAll('#defendParts .body-part').forEach(part => {
                part.addEventListener('click', () => {
                    document.querySelectorAll('#defendParts .body-part').forEach(p => p.classList.remove('selected'));
                    part.classList.add('selected');
                    selectedDefend = part.dataset.part;
                    updateAttackButton();
                });
            });

            function updateAttackButton() {
                const attackBtn = document.getElementById("submitBtn");
                attackBtn.disabled = !(selectedHit && selectedDefend);
            }

            // Real PvP attack button handler
            document.getElementById("submitBtn").onclick = async () => {
                if (selectedHit && selectedDefend) {
                    console.log('Submitting PvP action:', { hit: selectedHit, defend: selectedDefend, fight_id: window.currentFightId });

                    // Disable button during submission
                    const submitBtn = document.getElementById("submitBtn");
                    submitBtn.disabled = true;
                    submitBtn.textContent = "⚔️ Submitting...";

                    try {
                        const response = await fetch('/submit-pvp-action', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                fight_id: window.currentFightId,
                                player_id: currentPlayerId,
                                hit: selectedHit,
                                defend: selectedDefend
                            })
                        });

                        if (response.ok) {
                            submitBtn.textContent = "✅ Submitted!";
                            // Start polling for fight results
                            startPvPFightPolling();
                        } else {
                            const error = await response.json();
                            alert('Failed to submit action: ' + (error.message || 'Unknown error'));
                            // Re-enable button
                            submitBtn.disabled = false;
                            submitBtn.textContent = "⚔️ ATTACK!";
                        }
                    } catch (error) {
                        console.error('Error submitting PvP action:', error);
                        alert('Failed to submit action. Please try again.');
                        // Re-enable button
                        submitBtn.disabled = false;
                        submitBtn.textContent = "⚔️ ATTACK!";
                    }
                }
            };
        }

        function loadPvPFighterImages() {
            // Load player's fighter image
            fetch(`/profile/${currentPlayerId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.exists && data.profile && data.profile.race) {
                        loadPvPPlayerImage(data.profile.race, data.profile.nickname);
                    }
                })
                .catch(error => {
                    console.error('Error fetching player profile for PvP:', error);
                });

            // Fetch initial fight status to get opponent profile data immediately
            if (window.currentFightId) {
                fetch(`/pvp-fight-status/${window.currentFightId}/${currentPlayerId}`)
                    .then(response => response.json())
                    .then(data => {
                        console.log('Initial fight status for opponent image:', data);
                        if (data.opponentProfile && data.opponentProfile.race) {
                            updatePvPFighterImages(data.opponentProfile);
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching initial fight status:', error);
                    });
            }
        }

        function loadPvPPlayerImage(race, nickname) {
            const container = document.getElementById("playerImageContainer");
            const fallback = document.getElementById("playerFallback");
            const nameElement = document.getElementById("playerName");

            if (!container || !race) return;

            if (nameElement) {
                nameElement.textContent = nickname || 'You';
            }

            console.log('Loading PvP player fighter image for race:', race);

            const imgPath = `./images/fighters/${race}.png`;
            const img = document.createElement('img');
            img.src = imgPath;
            img.alt = `${race} fighter`;
            img.className = 'fighter-image';

            img.onload = function() {
                console.log('PvP player fighter image loaded successfully:', imgPath);
                fallback.style.display = 'none';
                container.appendChild(img);
            };

            img.onerror = function() {
                console.log('PvP player fighter image failed to load:', imgPath, 'Using fallback');
                const raceAvatars = {
                    "human": "🧑",
                    "elf": "🧝",
                    "dwarf": "🧔",
                    "orc": "👹"
                };
                fallback.innerHTML = raceAvatars[race] || "👤";
                fallback.style.display = 'flex';
            };
        }

        function loadPvPOpponentImage(race, nickname) {
            const container = document.getElementById("opponentImageContainer");
            const nameElement = document.getElementById("opponentName");
            if (!container || !race) return;

            if (nameElement) {
                nameElement.textContent = nickname || 'Opponent';
            }

            console.log('Loading PvP opponent image for race:', race, 'nickname:', nickname);

            const imgPath = `./images/fighters/${race}.png`;
            const img = document.createElement('img');
            img.src = imgPath;
            img.alt = `${race} opponent`;
            img.className = 'fighter-image';
            img.style.filter = 'sepia(50%) hue-rotate(10deg) saturate(1.5) brightness(0.9)'; // Make it look different

            img.onload = function() {
                console.log('PvP opponent image loaded successfully:', imgPath);
                const fallback = container.querySelector('.fighter-fallback');
                if (fallback) fallback.style.display = 'none';
                container.appendChild(img);
            };

            img.onerror = function() {
                console.log('PvP opponent image failed to load:', imgPath, 'using fallback');
                const raceAvatars = {
                    "human": "🧑",
                    "elf": "🧝",
                    "dwarf": "🧔",
                    "orc": "👹"
                };
                const fallback = container.querySelector('.fighter-fallback');
                if (fallback) {
                    fallback.innerHTML = raceAvatars[race] || "👤";
                    fallback.style.display = 'flex';
                }
            };
        }

        let opponentImageLoaded = false; // Flag to load opponent image only once

        function updatePvPFighterImages(opponentProfile) {
            // Only load opponent image once we get the profile data
            if (!opponentImageLoaded && opponentProfile.race) {
                console.log('Loading opponent image for race:', opponentProfile.race);
                loadPvPOpponentImage(opponentProfile.race, opponentProfile.nickname);
                opponentImageLoaded = true;
            }
        }

        function startPvPFightPolling() {
            console.log('Starting PvP fight polling for fight:', window.currentFightId);

            const pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/pvp-fight-status/${window.currentFightId}/${currentPlayerId}`);
                    const data = await response.json();

                    console.log('PvP fight status:', data);

                    // Update player stats
                    if (data.playerStats) {
                        document.getElementById('playerHPText').textContent = `${data.playerStats.hp}/${data.playerStats.maxHP}`;
                        document.getElementById('playerHPBar').innerHTML = renderHPBar(data.playerStats.hp, data.playerStats.maxHP);
                    }

                    // Update opponent stats
                    if (data.opponentStats) {
                        document.getElementById('opponentHPText').textContent = `${data.opponentStats.hp}/${data.opponentStats.maxHP}`;
                        document.getElementById('opponentHPBar').innerHTML = renderHPBar(data.opponentStats.hp, data.opponentStats.maxHP);
                    }

                    // Update fighter images if we have opponent profile data
                    if (data.opponentProfile && data.opponentProfile.race) {
                        updatePvPFighterImages(data.opponentProfile);
                    }

                    if (data.status === 'round_complete') {
                        clearInterval(pollInterval);
                        showPvPRoundResults(data.roundResults);
                    } else if (data.status === 'fight_complete') {
                        clearInterval(pollInterval);
                        showPvPFinalResults(data.finalResults);
                    } else if (data.status === 'waiting') {
                        updatePvPStatus(data);
                    }
                } catch (error) {
                    console.error('Error polling PvP fight status:', error);
                }
            }, 1000);
        }

        function updatePvPStatus(data) {
            const statusDiv = document.querySelector('.fight-status p');
            if (!statusDiv) return;

            if (data.my_action_submitted && data.opponent_action_submitted) {
                statusDiv.textContent = 'Both players submitted! Processing fight...';
            } else if (data.my_action_submitted) {
                statusDiv.textContent = 'You submitted! Waiting for opponent...';
            } else if (data.opponent_action_submitted) {
                statusDiv.textContent = 'Opponent submitted! Make your move!';
            } else {
                statusDiv.textContent = 'Waiting for both players to submit actions...';
            }
        }

        function showPvPRoundResults(results) {
            // Show the fight log with only the latest round result
            const fightLog = document.getElementById('fightLog');
            const logContent = document.getElementById('logContent');

            // Show the log area (it's hidden initially)
            fightLog.style.display = 'block';

            // Replace content with only the latest round messages and highlight damage values
            const newMessages = results.log.map(line => {
                // Highlight damage numbers in red (pattern: "X damage" or "X HP")
                const highlightedLine = line.replace(/(\d+)\s*(damage|HP)/gi, '<span style="color: var(--error-red); font-weight: bold;">$1</span> $2');
                return `<div class="fight-log-entry">${highlightedLine}</div>`;
            }).join('');
            logContent.innerHTML = newMessages;

            // Update status
            const statusDiv = document.querySelector('.fight-status p');
            if (statusDiv) {
                statusDiv.textContent = 'Round complete! Starting next round...';
            }

            // Auto-continue to next round after 2 seconds
            setTimeout(() => {
                // Re-enable attack button for next round
                const submitBtn = document.getElementById("submitBtn");
                submitBtn.disabled = false;
                submitBtn.textContent = "⚔️ ATTACK!";

                // Clear selections
                document.querySelectorAll('.body-part.selected').forEach(part => part.classList.remove('selected'));

                // Update status
                if (statusDiv) {
                    statusDiv.textContent = '';
                }
            }, 2000);
        }

        function showPvPFinalResults(results) {
            // Simple final results - just win/loss and back button
            console.log('Final results:', results); // Debug log to see what winner value we get

            // Prevent duplicate final results
            if (document.getElementById('finalResults')) {
                console.log('Final results already shown, skipping');
                return;
            }

            // Use XP gained to determine winner - if XP > 0, player won
            const isWin = results.xpGained > 0;
            const finalResultsHtml = `
                <div id="finalResults" class="fight-log" style="text-align: center;">
                    <div class="fight-log-header">🏆 Fight Finished!</div>
                    <div class="fight-log-content">
                        <div class="fight-log-entry" style="font-weight: bold; font-size: 24px; margin: 20px 0; color: ${isWin ? 'var(--success-green)' : 'var(--error-red)'};">
                            ${isWin ? '🎉 VICTORY!' : '💀 DEFEAT!'}
                        </div>
                        ${results.xpGained ? `<div class="fight-log-entry" style="color: var(--success-green); font-size: 16px; margin: 10px 0;">XP Gained: +${results.xpGained}</div>` : ''}
                    </div>
                    <div class="fight-result-actions" style="margin-top: 20px;">
                        <button class="btn-secondary" onclick="window.location.href='/players.html?telegram_id=${currentPlayerId}'" style="font-size: 18px; padding: 12px 24px;">
                            🏠 Back to Lobby
                        </button>
                    </div>
                </div>
            `;

            // Hide fight controls and status first
            document.querySelector('.fight-controls').style.display = 'none';
            document.querySelector('.fight-status').style.display = 'none';

            // Then add final results to the fight container
            document.querySelector('.fight-container').insertAdjacentHTML('beforeend', finalResultsHtml);
            document.getElementById('finalResults').style.display = 'block';
        }

        load();
    </script>
</body>
</html>
