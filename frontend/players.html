<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Online Players</title>
    <style>
        body { font-family: sans-serif; font-size: 20px; }
        h1 { font-size: 28px; }
        ul { list-style: none; padding: 0; }
        li {
            padding: 12px 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        li:hover { background-color: #f5f5f5; }
        li.selected {
            background-color: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        .empty { color: #888; }
        button {
            font-size: 18px;
            padding: 8px 16px;
            margin: 4px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .button-group { margin-top: 16px; }

        /* Tab styles */
        .tabs {
            display: flex;
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
        }
        .tab {
            padding: 12px 24px;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            margin-right: 4px;
            transition: background-color 0.2s;
        }
        .tab:hover {
            background: #e0e0e0;
        }
        .tab.active {
            background: #2196f3;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Request styles */
        .request-item {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .request-info {
            flex: 1;
        }
        .request-actions {
            display: flex;
            gap: 8px;
        }
        .request-timer {
            font-size: 14px;
            color: #666;
            font-weight: normal;
        }
        .request-type {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            color: #2196f3;
        }
        .accept-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .decline-btn, .cancel-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <h1>Fight vs Players</h1>

    <!-- Tab Navigation -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('players')">Online Players</button>
        <button class="tab" onclick="switchTab('requests')">Fight Requests <span id="requestsCount"></span></button>
    </div>

    <!-- Players Tab Content -->
    <div id="players-tab" class="tab-content active">
        <div id="content"></div>
        <div class="button-group">
            <button id="fightBtn" disabled>Fight</button>
            <button id="refreshBtn">Refresh</button>
            <button id="backBtn">Back</button>
        </div>
    </div>

    <!-- Requests Tab Content -->
    <div id="requests-tab" class="tab-content">
        <div id="sentRequests">
            <h3>Sent Requests</h3>
            <div id="sentRequestsList">
                <p class="empty">No sent requests</p>
            </div>
        </div>
        <div id="receivedRequests" style="margin-top: 30px;">
            <h3>Received Requests</h3>
            <div id="receivedRequestsList">
                <p class="empty">No received requests</p>
            </div>
        </div>
        <div class="button-group">
            <button id="refreshRequestsBtn">Refresh</button>
            <button id="backFromRequestsBtn">Back</button>
        </div>
    </div>

    <script>
        let selectedPlayer = null;
        let playersList = [];
        let currentPlayerId = null;
        let requestsPollingInterval = null;
        let challengePollingInterval = null;
        let sentRequests = [];
        let receivedRequests = [];

        // Tab switching functionality
        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab content
            document.getElementById(tabName + '-tab').classList.add('active');

            // Activate the clicked tab
            event.target.classList.add('active');

            // If switching to requests tab, load requests
            if (tabName === 'requests') {
                loadRequests();
                // Start polling for requests updates
                if (!requestsPollingInterval) {
                    requestsPollingInterval = setInterval(loadRequests, 3000);
                }
            } else {
                // Stop requests polling when leaving requests tab
                if (requestsPollingInterval) {
                    clearInterval(requestsPollingInterval);
                    requestsPollingInterval = null;
                }
            }
        }

        // Requests management functionality
        async function loadRequests() {
            if (!currentPlayerId) return;

            try {
                // Check for challenges as both challenger and target
                const response = await fetch(`/check-challenges/${currentPlayerId}`);
                const data = await response.json();

                if (data.hasChallenge) {
                    const challenge = data.challenge;

                    if (challenge.is_challenger) {
                        // This is a sent request
                        updateSentRequests([challenge]);
                        updateReceivedRequests([]);
                    } else {
                        // This is a received request
                        updateSentRequests([]);
                        updateReceivedRequests([challenge]);
                    }
                } else {
                    // No challenges
                    updateSentRequests([]);
                    updateReceivedRequests([]);
                }

                updateRequestsCount();
            } catch (error) {
                console.error('Error loading requests:', error);
            }
        }

        function calculateTimeLeft(timestamp) {
            const now = Date.now();
            const elapsed = now - timestamp;
            const CHALLENGE_TIMEOUT = 30 * 1000; // 30 seconds in milliseconds
            const remainingMs = CHALLENGE_TIMEOUT - elapsed;
            const remainingSeconds = Math.max(0, Math.floor(remainingMs / 1000));
            return remainingSeconds;
        }

        function updateSentRequests(requests) {
            sentRequests = requests;
            const sentList = document.getElementById('sentRequestsList');

            if (requests.length === 0) {
                sentList.innerHTML = '<p class="empty">No sent requests</p>';
                return;
            }

            sentList.innerHTML = requests.map(request => `
                <div class="request-item">
                    <div class="request-info">
                        <div class="request-type">Sent Request</div>
                        <strong>To: ${request.target_nickname}</strong>
                        <div class="request-timer" id="sent-timer-${request.target_id}">Calculating...</div>
                    </div>
                    <div class="request-actions">
                        <button class="cancel-btn" onclick="cancelSentRequest('${request.target_id}', '${request.target_nickname}')">
                            Cancel
                        </button>
                    </div>
                </div>
            `).join('');

            // Start timers for sent requests
            requests.forEach(request => {
                const timeLeft = calculateTimeLeft(request.timestamp);
                startRequestTimer(`sent-timer-${request.target_id}`, timeLeft);
            });
        }

        function updateReceivedRequests(requests) {
            receivedRequests = requests;
            const receivedList = document.getElementById('receivedRequestsList');

            if (requests.length === 0) {
                receivedList.innerHTML = '<p class="empty">No received requests</p>';
                return;
            }

            receivedList.innerHTML = requests.map(request => `
                <div class="request-item">
                    <div class="request-info">
                        <div class="request-type">Received Request</div>
                        <strong>From: ${request.challenger_nickname}</strong>
                        <div class="request-timer" id="received-timer-${request.challenger_id}">Calculating...</div>
                    </div>
                    <div class="request-actions">
                        <button class="accept-btn" onclick="acceptRequest('${request.challenger_id}', '${request.challenger_nickname}')">
                            Accept
                        </button>
                        <button class="decline-btn" onclick="declineRequest('${request.challenger_id}', '${request.challenger_nickname}')">
                            Decline
                        </button>
                    </div>
                </div>
            `).join('');

            // Start timers for received requests
            requests.forEach(request => {
                const timeLeft = calculateTimeLeft(request.timestamp);
                startRequestTimer(`received-timer-${request.challenger_id}`, timeLeft);
            });
        }

        function startRequestTimer(elementId, initialSeconds) {
            let timeLeft = initialSeconds;
            const element = document.getElementById(elementId);

            const updateTimer = () => {
                if (element) {
                    element.textContent = `⏱️ ${timeLeft}s remaining`;
                    if (timeLeft <= 0) {
                        element.textContent = '⏰ Expired';
                        element.style.color = '#f44336';
                    }
                }
                timeLeft--;
            };

            updateTimer();
            const timer = setInterval(() => {
                updateTimer();
                if (timeLeft < 0) {
                    clearInterval(timer);
                    // Refresh requests after expiry
                    setTimeout(loadRequests, 1000);
                }
            }, 1000);
        }

        function updateRequestsCount() {
            const count = sentRequests.length + receivedRequests.length;
            const countElement = document.getElementById('requestsCount');
            if (count > 0) {
                countElement.textContent = `(${count})`;
                countElement.style.color = '#f44336';
                countElement.style.fontWeight = 'bold';
            } else {
                countElement.textContent = '';
            }
        }

        // Request action handlers
        async function acceptRequest(challengerId, challengerNickname) {
            alert('Accept button clicked! challengerId: ' + challengerId);
            console.log('acceptRequest called:', { challengerId, challengerNickname, currentPlayerId });
            try {
                const response = await fetch('/join-fight', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challenger_id: challengerId,
                        target_id: currentPlayerId
                    })
                });

                const result = await response.json();
                console.log('join-fight response:', { ok: response.ok, result });

                if (response.ok) {
                    console.log('About to call startPvPFight with fight_id:', result.fight_id);
                    // Use the fight_id returned from join-fight to join the same fight as Player #1
                    startPvPFight(result.fight_id, challengerNickname);
                } else {
                    alert(`Failed to accept fight: ${result.message}`);
                }
            } catch (error) {
                console.error('Error accepting request:', error);
                alert('Failed to accept fight request');
            }
        }

        async function declineRequest(challengerId, challengerNickname) {
            try {
                const response = await fetch('/cancel-challenge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challenger_id: challengerId,
                        target_id: currentPlayerId,
                        cancelled_by: currentPlayerId
                    })
                });

                if (response.ok) {
                    alert(`Declined fight request from ${challengerNickname}`);
                    loadRequests();
                } else {
                    alert('Failed to decline request');
                }
            } catch (error) {
                console.error('Error declining request:', error);
                alert('Failed to decline request');
            }
        }

        async function cancelSentRequest(targetId, targetNickname) {
            try {
                const response = await fetch('/cancel-challenge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challenger_id: currentPlayerId,
                        target_id: targetId,
                        cancelled_by: currentPlayerId
                    })
                });

                if (response.ok) {
                    alert(`Cancelled fight request to ${targetNickname}`);
                    loadRequests();
                } else {
                    alert('Failed to cancel request');
                }
            } catch (error) {
                console.error('Error cancelling request:', error);
                alert('Failed to cancel request');
            }
        }

        function render(players){
            playersList = players;
            const content = document.getElementById('content');
            if(!players || players.length === 0){
                content.innerHTML = '<p class="empty">No players online right now.</p>';
                selectedPlayer = null;
                updateFightButton();
                return;
            }
            
            const list = document.createElement('ul');
            players.forEach(p => {
                const li = document.createElement('li');
                li.textContent = `${p.nickname} — level ${p.level}`;
                li.dataset.telegramId = p.telegram_id;
                li.dataset.nickname = p.nickname;
                li.dataset.level = p.level;
                
                // Add click handler for selection
                li.onclick = () => selectPlayer(p, li);
                
                list.appendChild(li);
            });
            
            content.innerHTML = '';
            content.appendChild(list);
        }

        function selectPlayer(player, liElement) {
            // Remove previous selection
            document.querySelectorAll('li').forEach(li => li.classList.remove('selected'));
            
            // Add selection to clicked item
            liElement.classList.add('selected');
            selectedPlayer = player;
            
            console.log('Selected player:', selectedPlayer);
            updateFightButton();
        }

        function updateFightButton() {
            const fightBtn = document.getElementById('fightBtn');
            fightBtn.disabled = !selectedPlayer;
        }


        async function load(){
            try {
                // Get current player ID from URL params first, then Telegram WebApp as fallback
                const urlParams = new URLSearchParams(window.location.search);
                currentPlayerId = urlParams.get('telegram_id');

                // Fallback to Telegram WebApp if not in URL
                if (!currentPlayerId && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                    currentPlayerId = window.Telegram.WebApp.initDataUnsafe.user.id;
                }

                console.log('Current player ID for exclusion:', currentPlayerId);
                const url = currentPlayerId ? `/players-online?exclude=${currentPlayerId}` : '/players-online';
                console.log('Fetching URL:', url);

                const res = await fetch(url);
                const data = await res.json();
                console.log('Players data received:', data);
                render(data.players || []);

                // Load requests for the requests tab count
                loadRequests();

                // Start challenge polling to detect when sent challenges are accepted
                startChallengePolling();
            } catch (e){
                console.error('Failed to load players:', e);
            }
        }

        // Challenge polling for Player #1 to detect when their challenge is accepted
        function startChallengePolling() {
            if (challengePollingInterval) return; // Already running

            challengePollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/check-challenges/${currentPlayerId}`);
                    const data = await response.json();

                    if (data.hasChallenge) {
                        console.log('Challenge polling detected:', data.challenge);
                        if (data.challenge.is_challenger) {
                            if (data.challenge.status === 'accepted') {
                                // Challenge was accepted, stop polling and show simple fight window for Player #1 (challenger)
                                console.log('Challenge accepted! Redirecting Player #1 to fight screen...');
                                clearInterval(challengePollingInterval);
                                challengePollingInterval = null;
                                // Use the fight_id from the challenge response
                                startPvPFight(data.challenge.fight_id, data.challenge.target_nickname);
                            }
                            // Note: we don't show "waiting" status here since requests tab handles it
                        }
                    }
                } catch (error) {
                    console.error('Error checking challenges:', error);
                }
            }, 1000); // Poll every 1 second for more responsive detection
        }

        document.getElementById('fightBtn').onclick = async () => {
            if (selectedPlayer) {
                try {
                    // Get current player info
                    const urlParams = new URLSearchParams(window.location.search);
                    let currentPlayerId = urlParams.get('telegram_id');
                    
                    if (!currentPlayerId && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                        currentPlayerId = window.Telegram.WebApp.initDataUnsafe.user.id;
                    }

                    // Get current player's nickname
                    const profileResponse = await fetch(`/profile/${currentPlayerId}`);
                    const profileData = await profileResponse.json();
                    
                    if (!profileData.exists) {
                        alert('Error: Current player profile not found');
                        return;
                    }

                    // Send challenge
                    const challengeResponse = await fetch('/challenge', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            challenger_id: currentPlayerId,
                            target_id: selectedPlayer.telegram_id,
                            challenger_nickname: profileData.profile.nickname
                        })
                    });

                    const challengeResult = await challengeResponse.json();
                    
                    if (challengeResponse.ok) {
                        alert(`Challenge sent to ${selectedPlayer.nickname}!`);
                        // Challenge status will be shown in Fight Requests tab
                    } else {
                        alert(`Failed to send challenge: ${challengeResult.message}`);
                    }
                } catch (error) {
                    console.error('Error sending challenge:', error);
                    alert('Failed to send challenge. Please try again.');
                }
            }
        };

        document.getElementById('refreshBtn').onclick = load;
        document.getElementById('backBtn').onclick = () => {
            window.location.href = '/';
        };

        // New button handlers for requests tab
        document.getElementById('refreshRequestsBtn').onclick = loadRequests;
        document.getElementById('backFromRequestsBtn').onclick = () => {
            window.location.href = '/';
        };

        // Clean up intervals when leaving the page
        window.addEventListener('beforeunload', () => {
            if (requestsPollingInterval) {
                clearInterval(requestsPollingInterval);
            }
            if (challengePollingInterval) {
                clearInterval(challengePollingInterval);
            }
        });

        function showSimpleFightWindow(opponentNickname) {
            // Stop any existing polling
            if (requestsPollingInterval) {
                clearInterval(requestsPollingInterval);
                requestsPollingInterval = null;
            }
            if (challengePollingInterval) {
                clearInterval(challengePollingInterval);
                challengePollingInterval = null;
            }

            // Start PvP fight
            startPvPFight(null, opponentNickname);
        }

        function startPvPFight(fight_id, opponentNickname) {
            let timeLeft = 120;
            let fightPollingInterval = null;
            let actualFightId = fight_id;

            // Only create a new fight if we don't have a fight_id (shouldn't happen in challenge flow)
            if (!actualFightId) {
                console.log('No fight_id provided - this should not happen in challenge acceptance flow');
                fetch('/create-pvp-fight', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        player_id: currentPlayerId,
                        opponent_nickname: opponentNickname
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.fight_id) {
                        actualFightId = data.fight_id;
                        console.log('PvP fight created:', actualFightId);
                    }
                })
                .catch(error => {
                    console.error('Error creating PvP fight:', error);
                });
            } else {
                console.log('Using existing fight_id:', actualFightId);
            }

            // Create fight interface
            document.body.innerHTML = `
                <div style="text-align: center; padding: 20px; font-family: sans-serif;">
                    <h1>🥊 PvP Fight vs ${opponentNickname}</h1>
                    <div id="playerStats" style="margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; display: inline-block;">
                        <h3>Your Stats</h3>
                        <div id="playerHP">Loading...</div>
                    </div>
                    <div id="opponentStats" style="margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; display: inline-block; margin-left: 20px;">
                        <h3>${opponentNickname}'s Stats</h3>
                        <div id="opponentHP">Loading...</div>
                    </div>

                    <div id="timer" style="font-size: 24px; color: #f44336; margin: 20px 0;">
                        Time left: ${timeLeft}s
                    </div>

                    <div style="margin: 20px 0;">
                        <label>Hit Part:
                            <select id="hit">
                                <option value="head">Head</option>
                                <option value="chest">Chest</option>
                                <option value="stomach">Stomach</option>
                                <option value="legs">Legs</option>
                            </select>
                        </label><br><br>

                        <label>Defend Part:
                            <select id="defend">
                                <option value="head">Head</option>
                                <option value="chest">Chest</option>
                                <option value="stomach">Stomach</option>
                                <option value="legs">Legs</option>
                            </select>
                        </label><br><br>

                        <button id="submitBtn" style="
                            background-color: #2196f3;
                            color: white;
                            border: none;
                            padding: 12px 24px;
                            border-radius: 4px;
                            font-size: 18px;
                            cursor: pointer;
                        ">Hit!</button>
                    </div>

                    <div id="status" style="margin: 20px 0; font-size: 16px;">
                        Waiting for both players to submit actions...
                    </div>

                    <div id="roundResults" style="margin: 20px 0; padding: 15px; border: 1px solid #ccc; display: none;">
                        <h3>Round Results</h3>
                        <div id="roundContent"></div>
                        <button id="nextRoundBtn" style="
                            background-color: #2196f3;
                            color: white;
                            border: none;
                            padding: 10px 20px;
                            border-radius: 4px;
                            font-size: 16px;
                            cursor: pointer;
                            margin-top: 10px;
                        ">Next Round</button>
                    </div>

                    <div id="finalResults" style="display: none; margin: 20px 0;">
                        <h3>Fight Finished!</h3>
                        <div id="finalContent"></div>
                        <button id="backToLobbyBtn" style="
                            background-color: #4caf50;
                            color: white;
                            border: none;
                            padding: 15px 30px;
                            border-radius: 8px;
                            font-size: 18px;
                            cursor: pointer;
                            margin-top: 16px;
                        ">Back to Lobby</button>
                    </div>
                </div>
            `;

            // Start countdown timer
            const timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = `Time left: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('status').textContent = 'Time\'s up!';
                }
            }, 1000);

            // Start polling for fight status
            fightPollingInterval = setInterval(async () => {
                if (!actualFightId) return;

                try {
                    const response = await fetch(`/pvp-fight-status/${actualFightId}/${currentPlayerId}`);
                    const data = await response.json();

                    // Update player stats
                    if (data.playerStats) {
                        document.getElementById('playerHP').innerHTML = `HP: ${data.playerStats.hp}/${data.playerStats.maxHP}`;
                    }
                    if (data.opponentStats) {
                        document.getElementById('opponentHP').innerHTML = `HP: ${data.opponentStats.hp}/${data.opponentStats.maxHP}`;
                    }

                    if (data.status === 'round_complete') {
                        clearInterval(timerInterval);
                        showRoundResults(data.roundResults);
                    } else if (data.status === 'fight_complete') {
                        clearInterval(timerInterval);
                        clearInterval(fightPollingInterval);
                        showFinalResults(data.finalResults);
                    } else if (data.status === 'waiting') {
                        updateFightStatus(data);
                    }
                } catch (error) {
                    console.error('Error checking PvP fight status:', error);
                }
            }, 1000);

            // Handle submit button
            document.getElementById('submitBtn').onclick = async () => {
                if (!actualFightId) {
                    alert('Fight not ready yet, please wait...');
                    return;
                }

                const hit = document.getElementById('hit').value;
                const defend = document.getElementById('defend').value;

                try {
                    const response = await fetch('/submit-pvp-action', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            fight_id: actualFightId,
                            player_id: currentPlayerId,
                            hit,
                            defend
                        })
                    });

                    if (response.ok) {
                        document.getElementById('submitBtn').disabled = true;
                        document.getElementById('submitBtn').textContent = 'Submitted!';
                        document.getElementById('status').textContent = 'Action submitted! Waiting for opponent...';
                    } else {
                        alert('Failed to submit action. Please try again.');
                    }
                } catch (error) {
                    console.error('Error submitting action:', error);
                    alert('Failed to submit action. Please try again.');
                }
            };

            // Handle back to lobby button
            const setupBackButton = () => {
                const backBtn = document.getElementById('backToLobbyBtn');
                if (backBtn) {
                    backBtn.onclick = () => {
                        clearInterval(timerInterval);
                        clearInterval(fightPollingInterval);
                        window.location.href = '/';
                    };
                }
            };

            // Set up back button initially
            setTimeout(setupBackButton, 100);
        }

        function updateFightStatus(data) {
            const statusDiv = document.getElementById('status');

            if (data.my_action_submitted && data.opponent_action_submitted) {
                statusDiv.textContent = 'Both players submitted! Processing fight...';
            } else if (data.my_action_submitted) {
                statusDiv.textContent = 'You submitted! Waiting for opponent...';
            } else if (data.opponent_action_submitted) {
                statusDiv.textContent = 'Opponent submitted! Make your move!';
            } else {
                statusDiv.textContent = 'Waiting for both players to submit actions...';
            }
        }

        function showRoundResults(results) {
            const roundDiv = document.getElementById('roundResults');
            const roundContent = document.getElementById('roundContent');

            roundContent.innerHTML = `
                <div style="margin: 10px 0;">
                    <strong>Round Results:</strong>
                </div>
                ${results.log.map(log => `<p>${log}</p>`).join('')}
                <div style="margin-top: 15px;">
                    <strong>Your HP:</strong> ${results.playerHP} |
                    <strong>Opponent HP:</strong> ${results.opponentHP}
                </div>
            `;

            roundDiv.style.display = 'block';

            // Setup next round button
            document.getElementById('nextRoundBtn').onclick = () => {
                roundDiv.style.display = 'none';

                // Re-enable the fight controls for next round
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').textContent = 'Hit!';
                document.getElementById('status').textContent = 'Waiting for both players to submit actions...';

                // Reset timer to 30 seconds
                let timeLeft = 120;
                const timerInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').textContent = `Time left: ${timeLeft}s`;

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        document.getElementById('submitBtn').disabled = true;
                        document.getElementById('status').textContent = 'Time\'s up!';
                    }
                }, 1000);
            };
        }

        function showFinalResults(results) {
            const finalDiv = document.getElementById('finalResults');
            const finalContent = document.getElementById('finalContent');

            finalContent.innerHTML = `
                <div style="font-size: 20px; margin: 20px 0;">
                    <strong>Winner: ${results.winner}</strong>
                </div>
                <div style="margin: 15px 0;">
                    <strong>Final Stats:</strong><br>
                    Your HP: ${results.playerHP}<br>
                    Opponent HP: ${results.opponentHP}
                </div>
                ${results.xpGained ? `<div style="margin: 15px 0; color: #4caf50;"><strong>XP Gained: +${results.xpGained}</strong></div>` : ''}
                <div style="margin-top: 20px;">
                    <h4>Fight Summary:</h4>
                    ${results.fullLog.map(log => `<p>${log}</p>`).join('')}
                </div>
            `;

            finalDiv.style.display = 'block';

            // Hide the fight controls
            document.getElementById('timer').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('status').style.display = 'none';
        }

        load();
    </script>
</body>
</html>
